<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
{%- if page.scripts -%}{%- for s in page.scripts %}
<script src="{{ s | relative_url }}" defer></script>
{%- endfor -%}{%- endif %}
</body>
</html>
